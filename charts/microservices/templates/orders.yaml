apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
spec:
  replicas: {{ .Values.orders.replicas }}
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: "{{ .Values.orders.image }}:{{ .Values.orders.tag }}"
          ports:
            - containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: {{ .Values.orders.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.orders.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: {{ .Values.orders.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.orders.liveness.periodSeconds }}
          resources:
{{ toYaml .Values.orders.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector:
    app: orders
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3002
  type: ClusterIP
