apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: users-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: users
  minReplicas: {{ .Values.users.hpa.minReplicas }}
  maxReplicas: {{ .Values.users.hpa.maxReplicas }} 
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.users.hpa.targetCPUUtilization }}
