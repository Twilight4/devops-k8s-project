apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: api-gateway
      minReplicas: {{ .Values.orders.hpa.minReplicas }}
      maxReplicas: {{ .Values.orders.hpa.maxReplicas }} 
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: {{ .Values.orders.hpa.targetCPUUtilization }}
