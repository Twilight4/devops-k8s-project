apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image }}:{{ .Values.apiGateway.tag }}"
          ports:
            - containerPort: 3000
          env:
            - name: USERS_URL
              value: "{{ .Values.apiGateway.env.usersUrl }}"
            - name: ORDERS_URL
              value: "{{ .Values.apiGateway.env.ordersUrl }}"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: {{ .Values.apiGateway.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiGateway.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: {{ .Values.apiGateway.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiGateway.liveness.periodSeconds }}
          resources:
{{ toYaml .Values.apiGateway.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
