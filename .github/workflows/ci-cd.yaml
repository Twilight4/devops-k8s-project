name: CI

on:
  push:
    branches: ["main"]
    tags: "[0-9]*.[0-9]*.[0-9]*"
    paths:
      - "services/**/*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Create a copy of this job for each of these paths
    strategy:
      matrix:
        service:
          - name: api-service
            path: services/api-service
          - name: orders-service
            path: services/orders-service
          - name: users-service
            path: services/users-service

    steps:
    - name: Checkout      
      uses: actions/checkout@v4

    # Login to Docker Hub
    # https://github.com/docker/login-action
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build and push users-service image
    - name: Build and push users-service image
      working-directory: ${{ matrix.service.path }}                     # working directory of the path of the copy of this job
      run: |
        IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}
        TAG=0.1.0

        echo "Building $IMAGE_NAME:$TAG from ${{ matrix.service.path }}"

        docker build -t $IMAGE_NAME:$TAG .
        docker push $IMAGE_NAME:$TAG
