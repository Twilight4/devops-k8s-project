name: CI

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Run npm install in all services
    - name: Install dependencies for users-service
      run: |
        cd services/users-service
        npm install
    - name: Install dependencies for orders-service
      run: |
        cd services/orders-service
        npm install
    - name: Install dependencies for api-gateway
      run: |
        cd services/api-gateway
        npm install
    # Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    # Build and push users-service image
    - name: Build and push users-service image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/users-service:${{ github.sha.substr(0, 7) }} ./services/users-service
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/users-service:${{ github.sha.substr(0, 7) }}
    # Build and push orders-service image
    - name: Build and push orders-service image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/orders-service:${{ github.sha.substr(0, 7) }} ./services/orders-service
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/orders-service:${{ github.sha.substr(0, 7) }}
    # Build and push api-gateway image
    - name: Build and push api-gateway image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/api-service:${{ github.sha.substr(0, 7) }} ./services/api-gateway
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-service:${{ github.sha.substr(0, 7) }}
